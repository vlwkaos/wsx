[workspace]
resolver = "2"
members = [
    "crates/wsx",
    "crates/wsx-core",
    "crates/wsx-terminal",
    "crates/wsx-daemon",
    "crates/wsx-web",
    "tools/xtask",
]
exclude = ["vendor/asched", "vendor/portable-pty"]

[workspace.package]
version = "0.41.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vlwkaos/wsx"

[workspace.dependencies]
# Shared between binary and library; pinned via the leaf Cargo.toml's that already exist.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
yaml_serde = "=0.10.7"
serde_ignored = "=0.1.14"
anyhow = "=1.0.103"
dirs = "5"
glob = "0.3"
libc = "0.2"
base64 = "=0.22.1"
asched-core = { path = "vendor/asched/crates/asched-core", version = "=0.2.0" }

# Binary-only
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }

# ^ Line tables keep a panic's and a backtrace's file:line in a smaller build. Set here, not
# in tasks.env, so the main checkout and every task copy build third-party crates with one
# artifact hash and a copy reuses main's cloned build (docs/tasks.md "Build output"). A
# debugger that needs locals: CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"
