[workspace]
resolver = "2"
members = [
    "crates/wsx",
    "crates/wsx-core",
]

[workspace.package]
version = "0.16.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/vlwkaos/wsx"

[workspace.dependencies]
# Shared between binary and library; pinned via the leaf Cargo.toml's that already exist.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
dirs = "5"
glob = "0.3"
libc = "0.2"

# Binary-only
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
