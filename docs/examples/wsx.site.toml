# Example wsx web site: Tailscale Service "wsx", all panels.
# Copy to ~/.config/wsx/web/wsx.toml and chmod 600 (the server refuses other modes).
# Deployment steps: docs/web-deploy.md. Fields: docs/web-client.md. Themes: docs/web-themes.md.
# ^ This file holds no secret. Web Push needs a private key: run `wsx web vapid`,
# paste its [push] block into your copy only, and add "push" to capabilities.

id = "wsx"
name = "wsx"
port = 4690
public_origin = "https://wsx.<tailnet>.ts.net"
panels = ["chat", "files", "terminal"]
theme = "default"

[access]
projects = "all"                  # every project wsx manages; or a list: ["/Users/me/code/app"]
capabilities = [
  "chat_send", "chat_answer", "agent_write", "session_start",
  "files_read", "files_write",
  "terminal_view", "terminal_input",
  "media_upload", "media_download",
  "task_view", "task_act",
]
# A session started from the page. In auto mode Claude's classifier reviews routine actions
# instead of a person; the prompts that remain arrive in the chat (chat_answer).
agent_command = ["claude", "--permission-mode", "auto"]
