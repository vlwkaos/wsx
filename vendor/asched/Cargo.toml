[workspace]
resolver = "2"
members = [
    "crates/asched",
    "crates/asched-core",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vlwkaos/asched"

[workspace.dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.60", features = ["derive"] }
crossterm = "=0.28.1"
dirs = "=5.0.1"
libc = "=0.2.180"
ratatui = { version = "=0.29.0", features = ["crossterm"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
toml = "=0.8.23"

