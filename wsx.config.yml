hooks:
  postCreate:
copy:
  include: []
  exclude: []
# Manager mode: workers and the manager run inside wsx's boundary (docs/tasks.md "Permissions").
tasks:
  # ^ Incremental builds leave every rebuild's object files behind; the debug level is
  # Cargo.toml's [profile.dev], the same as main's. A task copy stays about 1.8 GB, so 3 GB free
  # is one task's build (docs/tasks.md "Config", "Build output").
  env:
    CARGO_INCREMENTAL: "0"
  minFreeGb: 3
  # ^ Fast checks after each result and each land. The slow end-to-end scripts are the
  # scenarios below, run by the worker whose change touches their area.
  checks:
    - cargo fmt --all --check
    - cargo build -p wsx -p wsx-daemon
    # ^ The same command and toolchain as ci.yml's Clippy job.
    - cargo +1.96.1 clippy --workspace --all-targets --locked -- -D warnings
    - cargo nextest run --workspace --locked
  checkTimeoutSeconds: 1200
  # ^ Every call reads the whole context again: rotating at 200k costs less than letting it grow
  # (docs/design/token-usage.md "Rotation or compaction"). No long-context premium applies.
  # ^ A trial from 2026-11-04 for 8 landed tasks, judged on cost per landed task and reverts
  # against the 11-04 baseline ($2.38, 5.5 turns). The manager passes --model opus for large work.
  agent: { rotateTokens: 200000, model: sonnet }
  # ^ The end-to-end scripts. After a done result the task host runs each one whose
  # `scenarioPaths` name a path the task's commits changed; a changed path that no scenario and no
  # `scenarioFree` glob names runs every one with paths. One without paths runs only when a
  # worker names it (`wsx task check-run weblinux`). Each builds the binaries it runs first. A
  # `ci:` one runs on GitHub Actions without the check slot (scripts/ci-scenario.py, ci.yml);
  # by hand, run its job's command locally: `cargo build -p wsx -p wsx-daemon && python3 -B
  # scripts/test-web-client.py --browser` (docs/tasks.md "Scenarios").
  scenarios:
    task: "ci: python3 -B scripts/ci-scenario.py task"
    web: "ci: python3 -B scripts/ci-scenario.py web"
    weblinux: "ci: python3 -B scripts/ci-scenario.py weblinux"
    smoke: cargo build -p wsx -p wsx-daemon && python3 -B scripts/runtime-smoke.py
    boundary: cargo build -p wsx -p wsx-daemon && python3 -B scripts/test-manager-boundary.py
    memory: cargo build -p wsx && python3 -B scripts/test-memory.py "target/debug/wsx memory"
  scenarioPaths:
    # ^ Each scenario names every path whose output its journey reads, not its crate edges: the
    # task, web and boundary journeys drive the real task host, manager and wsxd through the CLI,
    # and task and smoke drive the TUI. Proof against main's breaks: docs/design/orchestration-lean.md §13.
    task: [crates/wsx, crates/wsx-core, crates/wsx-daemon, crates/wsx-terminal, scripts/test-task.py,
      "scripts/fake-*", scripts/ci-scenario.py, scripts/tui_pty.py, scripts/wsxd_client.py]
    web: [crates/wsx-web, crates/wsx-core, crates/wsx-daemon, crates/wsx-terminal, crates/wsx/src/task,
      crates/wsx/src/cli, crates/wsx/src/cli.rs, crates/wsx/src/main.rs, scripts/test-web-client.py,
      "scripts/*-check.mjs", scripts/web-cdp.mjs, "scripts/design-lint*", "scripts/fake-*",
      scripts/ci-scenario.py, scripts/wsxd_client.py]
    smoke: [crates/wsx, crates/wsx-core, crates/wsx-daemon, crates/wsx-terminal,
      scripts/runtime-smoke.py, scripts/tui_pty.py, scripts/wsxd_client.py]
    boundary: [crates/wsx/src/task, crates/wsx/src/cli, crates/wsx/src/cli.rs, crates/wsx/src/main.rs,
      crates/wsx-core, crates/wsx-daemon, crates/wsx-terminal, scripts/test-manager-boundary.py]
    memory: [crates/wsx-core/src/memory, crates/wsx/src/cli/memory.rs, scripts/test-memory.py,
      scripts/fake-memory-backend.py]
  # ^ Changed paths that need no scenario: with only these, no scenario runs.
  scenarioFree: [docs, knowledge, .github, scripts, "*.md", "**/*.md", wsx.config.yml,
    Cargo.toml, Cargo.lock, "crates/*/Cargo.toml", "crates/*/tests"]
  # ^ Workers get the owner's skills; the project's words for each stage (docs/tasks.md "Workflow").
  skills: owner
  # ^ Only these skills in a worker's list: all 76 cost 8.9k tokens in every prefix
  # (docs/design/token-usage.md option 1). The manager keeps all.
  skillsOnly: [develop, simplify, recall, memo, backpressure, ui-view-standards, seek, write-test]
  workflow:
    # ^ The steps (context, plan, build, review, memo) are the owner's, in ~/.config/wsx/wsx.config.yml.
    build: >-
      Follow CLAUDE.md and AGENTS.md. Keep the change lean: reuse what exists, remove what your
      change makes dead; prefer removing code to adding it. Before your result, search
      scripts/test-*.py and scripts/*-check.mjs for each UI string, label, menu item or route
      the diff adds, renames or removes, and update those asserts. When a scenario's answer comes
      as your next turn, fix what fails, also an assert your change made stale. `task` and `web`
      run on GitHub Actions; their captures come back to .work/web-captures. After a rebase or a
      conflict fix run no check-run: the host's checks follow. Never commit knowledge/: it is
      git-ignored.
    # ^ When session notes are newer than the last idle task, the manager host starts one task
    # with this prompt.
    idle: >-
      Run owner:dream to consolidate the session notes of knowledge/sessions/wsx in the main
      checkout into the vault folder that ir registers as the wsx collection
      (`ir collection list`; coding, domain, plan, history), pruning duplicates and stale entries. Write only that vault
      folder and the ir index in ~/.config/ir. First read the vault's history to see which
      sessions are already folded, and fold only the others; you may remove the vault's session
      files that are already folded. Never commit knowledge/ in this repository: it is untracked.
      Never commit in the vault: its sync job does. This task changes no repository file, so
      report done without a commit.
  deploy:
    command: sh scripts/deploy-web-live.sh
    auto: true
  # ^ Publishes the version of one main commit: the 0.31 handoff proof, the push, the tag and
  # release.yml, which tests first (scripts/release.sh). The owner approves each release.
  release:
    command: sh scripts/release.sh
    approve: true
