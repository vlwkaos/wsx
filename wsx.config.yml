hooks:
  postCreate:
copy:
  include: []
  exclude: []
git:
  subtrees:
    - vendor/asched
# Manager mode (docs/tasks.md "Permissions"). Workers build and test inside Claude's sandbox;
# the checks need a PTY or Chrome, which the sandbox cannot give, so the host runs them outside it.
tasks:
  sandbox:
    allowedDomains: [crates.io, index.crates.io, static.crates.io]
    # ^ wsx-terminal's build script runs Zig, which writes its global cache even when warm.
    allowWrite: ["~/.cargo/registry", "~/.cargo/git", "~/.cache/zig"]
  # ^ Incremental builds leave every rebuild's object files behind; without them a task copy
  # stays about 2.5 GB, so 3 GB free is one task's build (docs/tasks.md "Config", "Build output").
  env:
    CARGO_INCREMENTAL: "0"
  minFreeGb: 3
  # ^ Fast checks after each result and each land. The slow end-to-end scripts run once per
  # batch of lands, in the deploy of main (scripts/deploy-web-live.sh).
  checks:
    - cargo fmt --all --check
    - cargo build -p wsx -p wsx-daemon
    - cargo nextest run --workspace --locked
  checkTimeoutSeconds: 1200
  # ^ Workers get the owner's skills; the project's words for each stage (docs/tasks.md "Workflow").
  skills: owner
  workflow:
    # ^ The steps (context, plan, build, review, memo) are the owner's, in ~/.config/wsx/wsx.config.yml.
    build: >-
      Follow CLAUDE.md and AGENTS.md. Keep the change lean: reuse what exists, remove what your
      change makes dead; prefer removing code to adding it.
    # ^ At an idle recap after a land, the manager host starts one task with this prompt.
    idle: >-
      Run owner:dream on this branch to consolidate knowledge/sessions into knowledge/coding,
      knowledge/domain, plan and history, prune duplicates and stale entries, and commit the result.
  deploy:
    command: sh scripts/deploy-web-live.sh
    auto: true
