name: CI

"on":
  push:
    branches: [main, 'wsx-scenario/**']
    tags-ignore: ['**']
  pull_request:
  # ^ release.yml runs these tests on the v* tag before it builds or publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    if: ${{ !startsWith(github.ref_name, 'wsx-scenario/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install Nextest
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: nextest@0.9.143
          fallback: none

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.os }}

      - name: Validate release workflow
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/validate-release-workflow.py

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo nextest run --workspace --locked --profile ci

      - name: Run doctests
        run: cargo test --workspace --locked --doc

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify wsx-core package
        if: matrix.os == 'ubuntu-24.04'
        run: cargo publish --dry-run --locked -p wsx-core

      - name: Build runtime smoke binaries
        run: cargo build --locked -p wsx -p wsx-daemon

      - name: Run runtime smoke test
        run: python3 -u scripts/runtime-smoke.py

      - name: Run the memory contract test
        run: python3 -B scripts/test-memory.py "target/debug/wsx memory"

  # ^ The scenarios (`task`, `web`; parts in scripts/scenario.py) on a push to a `wsx-scenario/<name>/
  # <commit>[--<part>]` branch: scripts/ci-scenario.py pushes it when the task host finds the owner's
  # Mac cannot run the scenario (docs/design/scheduler.md). `scenario-parts` reads the name and part
  # from the ref and asks scripts/scenario.py for the matrix, so that file stays the one list of parts.
  # A push to main or a pull request or a tag runs the `task` parts when the task code changed.
  # ref: docs/tasks.md "Scenarios"
  scenario-parts:
    name: scenario parts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.parts.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: List the parts
        id: parts
        env:
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$REF" == wsx-scenario/* ]]; then
            spec=${REF#wsx-scenario/}
            name=${spec%%/*}
            rest=${spec#*/}
            part=''
            [[ "$rest" == *--* ]] && part=${rest##*--}
          else
            name=task
            part=''
          fi
          echo "matrix=$(python3 -B scripts/scenario.py --matrix "$name" $part)" >> "$GITHUB_OUTPUT"

  scenario:
    name: ${{ matrix.name }} scenario (${{ matrix.part }})
    needs: scenario-parts
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.scenario-parts.outputs.matrix) }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Look for a change to the task code
        id: changed
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref_name }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          paths='crates/wsx/src/task crates/wsx-core/src/task crates/wsx-core/src/memory crates/wsx/src/cli/memory.rs scripts/test-task.py scripts/test-memory.py scripts/fake-memory-backend.py'
          if [ "$REF_TYPE" = tag ] || [[ "$REF" == wsx-scenario/* ]] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            run=true
          elif git diff --quiet "$BEFORE" "$AFTER" -- $paths; then
            run=false
          else
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.1

      - name: Install Zig
        if: steps.changed.outputs.run == 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      # ^ Zig package cache rule (every job that builds wsx-terminal without setup-zig's own cache):
      # rust-cache drops the workspace crates, so crates/wsx-terminal/build.rs runs `zig build` in
      # every job, and with `use-cache: false` the Zig package dir (`$ZIG_GLOBAL_CACHE_DIR/p`) is
      # empty: 23 packages come from deps.files.ghostty.org, and a dropped connection fails the job.
      # Every such job only restores `zig-packages-*` (keyed on build.zig.zon, zig checks each
      # package's hash); `scenario-cache` is the one job that saves it, on a push to main.
      - name: Restore Zig packages
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/libghostty-vt/build.zig.zon') }}

      - name: Cache Rust build
        if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: scenario-build
          save-if: false

      - name: Run the scenario part
        if: steps.changed.outputs.run == 'true'
        run: python3 -B scripts/scenario.py ${{ matrix.name }} --part ${{ matrix.part }}

      - name: Pack the captures
        if: always() && steps.changed.outputs.run == 'true'
        run: if [ -d .work/web-captures ]; then tar -cf files.tar .work/web-captures; fi

      - name: Upload the captures
        if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-files-${{ matrix.name }}-${{ matrix.part }}
          path: files.tar
          if-no-files-found: ignore
          retention-days: 1

  # ^ The only job that saves the build cache the scenario jobs restore (shared-key
  # `scenario-build`): a push to main builds what they build. A branch reads the default branch's
  # caches, never another branch's.
  scenario-cache:
    name: scenario build cache
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      # ^ Restores and saves (see the Zig package cache rule in `task-scenario`).
      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/libghostty-vt/build.zig.zon') }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: scenario-build

      - name: Build wsx and wsxd
        run: cargo build --locked -p wsx -p wsx-daemon

      # ^ An empty `p/` would be saved under the key for good: fail before the cache saves it.
      - name: Check the Zig packages
        run: test -n "$(ls -A "$ZIG_GLOBAL_CACHE_DIR/p")"
