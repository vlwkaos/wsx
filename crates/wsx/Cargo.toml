[package]
name = "wsx"
description = "Project-first terminal workspace manager for Git worktrees"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "../../README.md"
keywords = ["tui", "git", "terminal", "worktree", "workspace"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "wsx"
path = "src/main.rs"

[dependencies]
wsx-core = { path = "../wsx-core", version = "=0.20.0" }
asched-core = { workspace = true }

ratatui = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
glob = { workspace = true }
libc = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
