[package]
name = "wsx"
description = "Project-first terminal workspace manager for Git worktrees"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "../../README.md"
keywords = ["tui", "git", "terminal", "worktree", "workspace"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "wsx"
path = "src/main.rs"

[dependencies]
wsx-core = { path = "../wsx-core", version = "=0.43.0" }
wsx-web = { path = "../wsx-web", version = "=0.43.0" }

ratatui = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
glob = { workspace = true }
libc = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

# ^ use-dev-tty on Linux only. The default mio source (edge-triggered epoll) returns after one
# 1 KiB read and leaves the rest of a key burst unread until the next key
# (crossterm-rs/crossterm#1142). macOS keeps the mio source: its pty input queue holds at most
# 1,022 bytes, so one 1 KiB read empties it and each refill is a new kqueue event. The /dev/tty
# source waits in select(), whose timeout macOS timer coalescing stretches: the TUI's 4 ms wait
# took about 30 ms at utility QoS, so pane output showed about 30 ms late.
[target.'cfg(target_os = "linux")'.dependencies]
crossterm = { workspace = true, features = ["use-dev-tty"] }
