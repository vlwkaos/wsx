[package]
name = "wsx-web"
description = "Hosted web client for wsx: one paired site per process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
wsx-core = { path = "../wsx-core", version = "=0.30.1" }

# docs/web-client.md lists why each of these is here.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "=1.47.5", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "=0.1.17", features = ["sync"] }
sha2 = "=0.10.9"
p256 = { version = "=0.13.2", features = ["ecdh", "ecdsa"] }
hkdf = "=0.12.4"
aes-gcm = "=0.10.3"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
