# Built-in theme "default". This file is also the complete token list:
# a theme must define every token here, directly or through `extends`.
# Contract, value rules and the contrast of each color pair: docs/web-themes.md.
name = "default"

[icons]
png_192 = "icon-192.png"
png_512 = "icon-512.png"

# The light scheme. The page shows the dark scheme below unless the device chose light.
[tokens]
# Color roles
color-bg = "#f7f7f8"
color-surface = "#ffffff"
color-raised = "#ecedef"
color-hairline = "#00000014"
color-text = "#16181c"
color-muted = "#5a6069"
color-faint = "#646a74"
color-accent = "#0b6b56"
color-accent-text = "#ffffff"
color-attention = "#8a5a00"
color-danger = "#b3261e"
color-overlay = "#00000066"
# Other projects' managers in the manager chat: one each, chosen by project.
color-peer-1 = "#2a59c4"
color-peer-2 = "#7a3fc4"
color-peer-3 = "#a8326f"
color-peer-4 = "#4d7300"
# Terminal palette: ANSI 0-7, then bright 8-15. The terminal frame is always dark,
# so a theme with a dark scheme only needs readable values there.
color-ansi-0 = "#747983"
color-ansi-1 = "#f2777a"
color-ansi-2 = "#7bd88f"
color-ansi-3 = "#f2b84b"
color-ansi-4 = "#7aa7f7"
color-ansi-5 = "#c594f0"
color-ansi-6 = "#5fd4e0"
color-ansi-7 = "#c9ccd1"
color-ansi-8 = "#8b9098"
color-ansi-9 = "#ff9a9c"
color-ansi-10 = "#9be8ad"
color-ansi-11 = "#f8cf7a"
color-ansi-12 = "#a3c3ff"
color-ansi-13 = "#d9b5f7"
color-ansi-14 = "#8de4ec"
color-ansi-15 = "#ffffff"
# Type. UI text is the system font; mono is for the terminal, code and file paths.
font-body = "system-ui, -apple-system, 'Segoe UI Variable', 'Segoe UI', Roboto, sans-serif"
font-mono = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
# The terminal: the shipped font with ligatures, the shipped symbols font, then the system
# mono fonts, which also supply Korean and other wide characters.
font-terminal = "'JetBrains Mono', 'Symbols Nerd Font Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
font-size-md = "15px"
font-size-sm = "13px"
font-size-label = "12px"
font-size-title = "22px"
# Text fields on a touch device. iOS zooms the page when a focused field is below 16px.
font-size-field = "16px"
font-weight-medium = "500"
font-weight-strong = "600"
line-height = "1.4"
line-height-prose = "1.55"
# Letter spacing of section labels and screen titles.
tracking-label = "0.06em"
tracking-title = "-0.01em"
# Spacing: a 4px grid; space-4 is the screen gutter and the row inset.
space-1 = "4px"
space-2 = "8px"
space-3 = "12px"
space-4 = "16px"
# Sizes
size-control = "44px"
size-row = "52px"
size-bar = "48px"
size-key = "36px"
size-rail = "300px"
size-prose = "72ch"
# Radius and border
radius-control = "10px"
radius-key = "8px"
radius-sheet = "16px"
border-width = "1px"
# Motion
motion-duration = "160ms"
motion-easing = "ease-out"
# Focus
focus-width = "2px"
# Opacity
opacity-disabled = "0.45"

# Only color-* and opacity-* tokens may differ in the dark scheme.
[tokens_dark]
color-bg = "#0a0b0d"
color-surface = "#121417"
color-raised = "#1a1d22"
color-hairline = "#ffffff14"
color-text = "#ecedee"
color-muted = "#9aa0a8"
color-faint = "#80858e"
color-accent = "#6fe3c1"
color-accent-text = "#06231b"
color-attention = "#f2b84b"
color-danger = "#f2777a"
color-overlay = "#000000a6"
color-peer-1 = "#7aa7f7"
color-peer-2 = "#c594f0"
color-peer-3 = "#f589c4"
color-peer-4 = "#a9d16a"
