# Built-in theme "retro": System 7 gray surfaces, black hairlines and beveled
# controls, after the remotty project's retro theme. Light scheme only.
# ^ No font is bundled. Chicago (ChicagoFLF) has conflicting licence statements,
# so the stack names it for machines that have it and falls back to Geneva and
# Verdana. A custom theme that extends this one can ship a font file.
name = "retro"
extends = "default"
components = "components.css"

[icons]
png_192 = "icon-192.png"
png_512 = "icon-512.png"

[tokens]
color-bg = "#c0c0c0"
color-surface = "#c0c0c0"
color-sunken = "#ffffff"
color-text = "#000000"
color-muted = "#3a3a3a"
color-border = "#000000"
color-accent = "#000000"
color-accent-text = "#ffffff"
color-danger = "#8b0000"
color-ok = "#004d1a"
color-focus = "#000000"
color-chrome-bg = "#c0c0c0"
color-chrome-text = "#000000"
color-bubble-user-bg = "#c0c0c0"
color-bubble-user-text = "#000000"
color-bubble-agent-bg = "#ffffff"
color-bubble-agent-text = "#000000"
color-terminal-bg = "#000000"
color-terminal-text = "#e6e6e6"
color-overlay = "#00000080"
font-body = "Chicago, ChicagoFLF, Charcoal, Geneva, Verdana, system-ui, sans-serif"
font-heading = "Chicago, ChicagoFLF, Charcoal, Geneva, Verdana, system-ui, sans-serif"
font-mono = "'JetBrainsMono Nerd Font Mono', 'JetBrains Mono', Monaco, Menlo, ui-monospace, monospace"
font-size-sm = "0.75rem"
font-size-md = "0.875rem"
font-size-lg = "0.9375rem"
font-size-xl = "1.125rem"
font-size-mono = "0.8125rem"
font-weight-strong = "700"
line-height = "1.4"
space-1 = "2px"
space-2 = "6px"
space-3 = "8px"
space-4 = "12px"
space-5 = "16px"
size-control = "36px"
radius-control = "4px"
radius-surface = "0"
border-width = "1px"
shadow-raised = "inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080"
shadow-sunken = "inset 1px 1px 0 #808080, inset -1px -1px 0 #ffffff"
shadow-overlay = "2px 2px 0 #000000"
motion-duration = "0ms"
motion-easing = "linear"
focus-width = "2px"
focus-offset = "1px"
opacity-disabled = "0.5"
opacity-quiet = "1"
